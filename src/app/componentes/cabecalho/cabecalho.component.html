<header class="cabecalho">
  <img src="/assets/logo.png" alt="Logo do Indexa" class="logo">
  @if (!telaInicial) {
    <div class="link">
        <button>
          <img class="seta" src="assets/arrow-left.png" alt="">
          <a routerLink="/lista-contatos">Voltar</a>
        </button>
      </div>
  }
  <img [src]="bannerSrc" alt="Banner do Indexa" class="banner">
  <h1 [innerHTML]="titulo" [ngClass]="telaInicial ? 'titulo' : 'titulo-form'"></h1>
</header>
